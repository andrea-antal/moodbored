<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9">
  <title>moodbored</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Board view: what the app opens on -->
  <section id="board-view" class="view">
    <header class="bar">
      <button class="icon-btn" id="close-board" title="Close board — see all boards" aria-label="Close board">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="board-meta">
        <input id="board-title" class="title-input" type="text" spellcheck="false" autocomplete="off" aria-label="Board name">
        <span id="board-date" class="date-chip"></span>
      </div>
      <div class="bar-actions">
        <span id="save-status" class="save-status" aria-live="polite"></span>
        <button class="btn" id="save-btn" title="Save (⌘S)">Save</button>
        <div class="add-wrap">
          <button class="btn btn-dark" id="add-btn" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add</span>
          </button>
          <div id="add-menu" class="menu" hidden>
            <form id="url-form" class="url-form">
              <input id="url-input" type="text" inputmode="url" placeholder="Paste a link, image URL or #hex" autocomplete="off">
              <button class="btn" type="submit">Add</button>
            </form>
            <button class="menu-item" data-add="file">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
              Photo or video
            </button>
            <button class="menu-item" data-add="text">
              <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
              Text
            </button>
            <button class="menu-item" data-add="color">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg>
              Colour swatch
            </button>
            <hr>
            <button class="menu-item" data-add="print">
              <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2"/><rect x="7" y="14" width="10" height="6"/></svg>
              Print / PDF
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="print-head">
      <h1 id="print-title"></h1>
      <span id="print-date"></span>
    </div>

    <main class="board-wrap" id="board-wrap">
      <div class="board" id="board"></div>
      <div class="empty" id="empty">
        <p>Paste, drop, or <strong>Add</strong> to start.</p>
        <p class="hint">Photos, links, YouTube, text, #hex colours. Drag to move · corner to resize.</p>
      </div>
    </main>

    <div id="selbar" class="selbar" hidden></div>
    <div id="drop-overlay" class="drop-overlay" hidden><span>Drop to add</span></div>
    <input id="file-input" type="file" accept="image/*,video/*" multiple hidden>
  </section>

  <!-- Library: every saved board -->
  <section id="library-view" class="view" hidden>
    <header class="bar">
      <span class="wordmark">moodbored</span>
      <div class="bar-actions">
        <button class="btn" id="back-to-board" hidden>Back to board</button>
        <button class="btn btn-dark" id="new-board">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New board</span>
        </button>
      </div>
    </header>
    <main class="library">
      <p class="lib-note" id="lib-note"></p>
      <div class="lib-grid" id="lib-grid"></div>
      <div id="lib-sentinel"></div>
    </main>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
